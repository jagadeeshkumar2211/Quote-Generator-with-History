<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4efe6">
    <title>Daily Quote</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app-shell">
        <header class="topbar">
            <a class="brand" href="/" aria-label="Daily Quote home">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M7.5 17.5H5.8A2.8 2.8 0 0 1 3 14.7V12a2 2 0 0 1 2-2h3.5v7.5Zm10 0h-1.7a2.8 2.8 0 0 1-2.8-2.8V12a2 2 0 0 1 2-2h3.5v7.5Zm-9.2-7.5c0-3.2 1.7-5.5 4.8-7M18.3 10c0-3.2 1.2-5.5 3.7-7"/></svg>
                </span>
                <span>Daily Quote</span>
            </a>
            <span class="header-date" id="headerDate"></span>
        </header>

        <section class="content">
            <article class="quote-panel">
                <div class="quote-content" aria-live="polite">
                    <div class="eyebrow">
                        <span class="eyebrow-line"></span>
                        <span>Thought of the day</span>
                    </div>
                    <blockquote>
                        <span class="opening-mark" aria-hidden="true">“</span>
                        <p id="quote">Loading a little inspiration...</p>
                    </blockquote>
                    <div class="author-wrap">
                        <span class="author-line"></span>
                        <h2 id="author">Finding an author</h2>
                    </div>
                </div>

                <div class="action-row">
                    <button class="primary-btn" id="newQuoteBtn" type="button">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8.1 8.1 0 0 0-15.5-3M4 4v4h4M4 13a8.1 8.1 0 0 0 15.5 3M20 20v-4h-4"/></svg>
                        <span>New quote</span>
                    </button>
                    <div class="icon-actions">
                        <button class="icon-btn" id="favoriteBtn" type="button" aria-label="Save to favorites" title="Save to favorites">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78Z"/></svg>
                        </button>
                        <button class="icon-btn" id="copyBtn" type="button" aria-label="Copy quote" title="Copy quote">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/></svg>
                        </button>
                    </div>
                </div>
            </article>

            <aside class="favorites-panel">
                <div class="favorites-heading">
                    <div>
                        <p class="section-kicker">Your collection</p>
                        <h2>Favorites</h2>
                    </div>
                    <span class="favorite-count" id="favoriteCount">0</span>
                </div>
                <div id="favoritesList" class="favorites-list">
                    <div class="empty-state">
                        <span class="empty-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78Z"/></svg>
                        </span>
                        <p>No favorites yet</p>
                        <small>Save a quote you love</small>
                    </div>
                </div>
            </aside>
        </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="script.js"></script>
</body>
</html>
